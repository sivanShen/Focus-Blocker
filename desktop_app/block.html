<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Blocker - 限制中</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            cursor: none; /* Make it more immersive */
        }

        .icon-container {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            animation: pulse 2s infinite ease-in-out;
        }

        .icon-container svg {
            width: 100%;
            height: 100%;
            fill: var(--text-primary);
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        #timer {
            font-size: 5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin: 2rem 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            display: none;
        }

        .progress-bar {
            width: 300px;
            height: 4px;
            background-color: #333;
            border-radius: 2px;
            margin: 1rem auto;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--text-primary);
            width: 0%;
            transition: width 1s linear;
        }

        #actionArea {
            display: none;
            animation: fadeIn 1s forwards;
            margin-top: 2rem;
        }

        .duration-select {
            background: transparent;
            color: white;
            border: 1px solid #555;
            padding: 0.75rem 1.5rem;
            font-size: 1.25rem;
            border-radius: 8px;
            margin-right: 1rem;
            cursor: pointer;
        }

        .duration-select option {
            background: #111;
        }

        .btn {
            background-color: var(--text-primary);
            color: var(--bg-color);
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .interactive-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 4rem;
        }

        .interactive-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
            animation: bounce 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div id="interactiveOverlay" class="interactive-overlay">
        <div class="interactive-text">點擊任意處開始倒數</div>
    </div>

    <div class="icon-container">
        <!-- Default Sandclock SVG -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 2v6h.01L6 8.01 10 12l-4 4 .01.01H6V22h12v-5.99h-.01L18 16l-4-4 4-3.99-.01-.01H18V2H6zm10 14.5V20H8v-3.5l4-4 4 4zm-4-5l-4-4V4h8v3.5l-4 4z"/>
        </svg>
    </div>
    
    <h1>深呼吸，稍等一下</h1>
    
    <div id="timer">--:--</div>
    
    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="actionArea">
        <select id="duration" class="duration-select">
            <option value="5">解鎖 5 分鐘</option>
            <option value="15">解鎖 15 分鐘</option>
        </select>
        <button id="unlockBtn" class="btn">解鎖全局</button>
    </div>

    <script src="block.js"></script>
</body>
</html>
