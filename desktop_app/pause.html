<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Blocker - 抓到作弊</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111;
            color: #fff;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            user-select: none;
            overflow: hidden;
        }
        h1 { color: #f43f5e; font-size: 2.5rem; margin-bottom: 1rem; }
        p { font-size: 1.2rem; color: #a0a0a0; margin-bottom: 2rem; max-width: 80%; }
        .select-container { display: flex; flex-direction: column; gap: 1rem; width: 300px; }
        .btn {
            background-color: #3b82f6;
            color: #fff;
            border: none;
            padding: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background-color: #2563eb; transform: scale(1.02); }
        .btn-danger { background-color: transparent; border: 1px solid #555; color: #888; }
    </style>
</head>
<body>
    <h1>⚠️ 偵測到擴充功能被關閉</h1>
    <p>系統發現您關閉了 Focus Blocker 擴充功能！請誠實選擇您想要暫停多久：</p>
    
    <div class="select-container" id="btnContainer">
        <button class="btn" data-minutes="5">暫停 5 分鐘</button>
        <button class="btn" data-minutes="10">暫停 10 分鐘</button>
        <button class="btn" data-minutes="30">暫停 30 分鐘</button>
        <button class="btn" data-minutes="60">暫停 1 小時</button>
        <button class="btn" data-minutes="120">暫停 2 小時</button>
    </div>

    <script src="pause.js"></script>
</body>
</html>
