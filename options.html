<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Blocker - 設定</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Focus Blocker</h1>
            <p>設定你的專注時段與限制網站</p>
        </header>

        <section class="card">
            <h2>限制時段</h2>
            <p class="subtitle">設定多個你想限制存取的時段</p>
            <ul id="timeSlotsList" class="domain-list" style="margin-bottom: 1rem;">
                <!-- Time slots will be populated here -->
            </ul>
            <div class="time-settings">
                <div class="time-group">
                    <label for="startTime">開始時間</label>
                    <input type="time" id="startTime" value="09:00">
                </div>
                <div class="time-separator">至</div>
                <div class="time-group">
                    <label for="endTime">結束時間</label>
                    <input type="time" id="endTime" value="12:00">
                </div>
            </div>
            <button id="addTimeSlotBtn" class="btn primary">新增時段</button>
            <span id="timeStatus" class="status-msg"></span>
        </section>

        <section class="card">
            <h2>受限網站名單</h2>
            <p class="subtitle">輸入網域即可（例如：youtube.com）</p>
            <div class="input-group">
                <input type="text" id="domainInput" placeholder="例如：facebook.com">
                <button id="addDomainBtn" class="btn primary">新增</button>
            </div>
            <ul id="domainList" class="domain-list">
                <!-- Domains will be populated here -->
            </ul>
        </section>
    </div>
    <script src="options.js"></script>
</body>
</html>
